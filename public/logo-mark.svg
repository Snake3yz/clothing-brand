<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="kayooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="100" height="100" rx="22" fill="#0C0C0E"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="#26262B" stroke-width="2"/>
  
  <!-- Subtle Purple Corner Glow -->
  <circle cx="50" cy="50" r="42" stroke="#A855F7" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Bold Geometric 'K' for KAYOO -->
  <path d="M30 22 L40 22 L40 78 L30 78 Z" fill="#FFFFFF"/>
  <path d="M40 50 L64 22 L76 22 L51 51 L78 78 L65 78 L40 52 Z" fill="url(#kayooGrad)"/>

  <!-- Signature KAYOO Starburst Accent in Top Right -->
  <path d="M72 18 Q72 26 80 26 Q72 26 72 34 Q72 26 64 26 Q72 26 72 18 Z" fill="#D8B4FE" filter="url(#glow)"/>
</svg>
